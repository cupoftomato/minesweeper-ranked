<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper Ranked</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="lobby-screen">
    <div class="logo">
      <h1>MINESWEEPER <span class="ranked">RANKED</span></h1>
      <p>Esports Edition</p>
    </div>
    
    <div class="lobby-box">
      <div id="action-buttons">
        <button id="btnNormal" class="btn-mode normal-btn">PLAY NORMAL</button>
        <button id="btnRanked" class="btn-mode ranked-btn">PLAY RANKED</button>
      </div>
      
      <div id="matchmaking-status" class="hidden">
         <div class="spinner"></div>
         <p id="status-text">Đang tìm đối thủ...</p>
         <button id="btnCancel">HỦY TÌM TRẬN</button>
      </div>

      <p id="lobbyMessage" class="error"></p>
    </div>
  </div>

  <div id="game-screen" class="hidden">
    <!-- Header: HUD -->
    <div class="hud">
      <div class="player-info p1-info">
        <div class="name">BẠN <span id="my-elo"></span></div>
        <div class="strikes" id="p1-strikes">Lỗi: 0/3</div>
      </div>

      <!-- Tug of war progress -->
      <div class="tug-of-war">
         <div class="tug-bar" id="p1-bar" style="width: 50%;"></div>
         <div class="tug-bar" id="p2-bar" style="width: 50%;"></div>
      </div>

      <div class="player-info p2-info">
        <div class="name">ĐỐI THỦ <span id="opp-elo"></span></div>
        <div class="strikes">Trạng thái: <span id="p2-status">Bình thường</span></div>
      </div>
    </div>
    
    <!-- Timer -->
    <div class="timer" id="timerDisplay">00:00.000</div>

    <!-- Main Game Area -->
    <div class="board-container">
      <div id="freeze-overlay" class="hidden">ĐÓNG BĂNG PHẠT LỖI</div>
      <div id="minesweeper-board"></div>
    </div>

    <!-- Result / Messages -->
    <div id="gameMessage" class="message-banner hidden"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
